name = "wealtharrays-github-io"
main = "./worker.mjs"
compatibility_date = "2026-10-12"
routes = [{ pattern = "wealtharrays.com/v1/*", zone_name = "wealtharrays.com" }]

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/v1/*"]
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"

[[ratelimits]]
name = "PUBLIC_API_LIMITER"
namespace_id = "2026103001"
simple = { limit = 120, period = 60 }

[[d1_databases]]
binding = "DB"
database_name = "wealtharrays-saas"
database_id = "b09bd71a-40dc-40f4-81bd-6018b302916b"
migrations_dir = "migrations"
