name = "wealtharrays-github-io"
main = "./worker.mjs"
compatibility_date = "2026-10-12"
routes = [{ pattern = "wealtharrays.com/v1/*", zone_name = "wealtharrays.com" }]

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/v1/*"]
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"
