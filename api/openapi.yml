openapi: 3.0.3
info:
  title: Wealth Arrays Financial Engine API
  version: 1.0.0
  description: Deterministic financial calculations with reproducible inputs, assumptions, model versions and provenance. This is an integration contract; hosting, authentication and rate limiting are external infrastructure concerns.
paths:
  /v1/auth-config:
    get:
      summary: Return public authentication configuration
      operationId: getAuthConfig
      responses:
        '200': {description: Public Supabase URL and anon key}
        '503': {description: Authentication not configured}
  /v1/scenarios:
    get:
      summary: List the authenticated user's cloud scenarios
      operationId: listSavedScenarios
      security: [{bearerAuth: []}]
      responses:
        '200': {description: User-owned saved scenarios}
        '401': {description: Authentication required}
    post:
      summary: Save a scenario to the authenticated user's account
      operationId: saveScenario
      security: [{bearerAuth: []}]
      responses:
        '201': {description: Scenario saved}
        '400': {description: Invalid scenario}
        '401': {description: Authentication required}
    delete:
      summary: Delete a user-owned saved scenario
      operationId: deleteScenario
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Scenario deleted}
        '404': {description: Scenario not found}
  /v1/billing/checkout:
    post:
      summary: Create a Razorpay subscription checkout
      operationId: createBillingCheckout
      security: [{bearerAuth: []}]
      responses:
        '201': {description: Razorpay checkout URL}
        '503': {description: Billing or database is not configured}
  /v1/billing/webhook:
    post:
      summary: Verify and process Razorpay subscription webhook events
      operationId: processRazorpayWebhook
      responses:
        '200': {description: Webhook accepted}
        '401': {description: Invalid signature}
  /v1/billing/status:
    get:
      summary: Read the authenticated user's latest subscription status
      operationId: getBillingStatus
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Subscription status}
  /v1/fx:
    get:
      summary: Retrieve indicative foreign-exchange rates
      operationId: getLiveFxRates
      parameters:
        - in: query
          name: base
          schema: {type: string, minLength: 3, maxLength: 3, default: INR}
        - in: query
          name: symbols
          schema: {type: string, description: Optional comma-separated currency codes}
      responses:
        '200':
          description: Indicative rates and provider update timestamp
        '400':
          description: Unsupported currency code
        '502':
          description: Rate provider unavailable
  /v1/india-tax:
    post:
      summary: Estimate Indian new-regime income tax for tax year 2026-27
      operationId: calculateIndiaTax
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [taxable_income]
              properties:
                tax_year: {type: string, enum: ["2026-27"]}
                regime: {type: string, enum: [new]}
                taxable_income: {type: number, minimum: 0, maximum: 1000000000}
      responses:
        '200':
          description: Tax estimate with model version and assumptions
        '400':
          description: Invalid taxable income
        '422':
          description: Unsupported tax year or regime
  /v1/calculate:
    post:
      summary: Calculate a registered financial model
      operationId: calculateModel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CalculationRequest'
      responses:
        '200':
          description: Deterministic result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalculationResponse'
        '400':
          description: Invalid or incomplete input
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '422':
          description: Unsupported model, country rule or version
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /v1/models:
    get:
      summary: List available calculation models
      operationId: listModels
      responses:
        '200':
          description: Model registry
          content:
            application/json:
              schema:
                type: object
                required: [models]
                properties:
                  models:
                    type: array
                    items:
                      $ref: '#/components/schemas/ModelSummary'
components:
  schemas:
    CalculationRequest:
      type: object
      required: [model, inputs]
      properties:
        model: {type: string, description: Registered model ID}
        model_version: {type: string, description: Optional exact model version; server must reject unsupported versions}
        inputs: {type: object, additionalProperties: true}
        assumptions: {type: object, additionalProperties: true}
        country: {type: string, description: ISO 3166-1 alpha-2 country code when jurisdiction matters}
        currency: {type: string, description: ISO 4217 currency code}
    CalculationResponse:
      type: object
      required: [model, model_version, inputs, assumptions, results, limitations]
      properties:
        model: {type: string}
        model_version: {type: string}
        inputs: {type: object, additionalProperties: true}
        assumptions: {type: object, additionalProperties: true}
        results: {type: object, additionalProperties: true}
        limitations:
          type: array
          items: {type: string}
        sources:
          type: array
          items:
            type: object
            additionalProperties: true
        reproducibility:
          type: object
          additionalProperties: true
    ModelSummary:
      type: object
      required: [id, version, family, timing, formula, inputs, limitations]
      properties:
        id: {type: string}
        version: {type: string}
        family: {type: string}
        timing: {type: string}
        formula: {type: string}
        inputs:
          type: array
          items: {type: string}
        limitations:
          type: array
          items: {type: string}
    ErrorResponse:
      type: object
      required: [error, message]
      properties:
        error: {type: string}
        message: {type: string}
        details: {type: object, additionalProperties: true}
