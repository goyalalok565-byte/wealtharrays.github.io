name: Phase 3 Static SEO Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  phase3-seo-build:
    if: ${{ !contains(github.event.head_commit.message, '[phase3-build]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build static SEO metadata
        run: node scripts/phase3-seo-build.mjs
      - name: Commit SEO build changes
        run: |
          git config user.name "wealtharrays-seo-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html' 'articles/*.html'
          if git diff --cached --quiet; then
            echo "No SEO build changes needed"
            exit 0
          fi
          git commit -m "chore: apply Phase 3 static SEO build [phase3-build]"
          git push
