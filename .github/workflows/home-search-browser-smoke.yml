name: Homepage search browser smoke

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  smoke:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start local site
        run: |
          python3 -m http.server 4173 --directory . > /tmp/wealtharrays-http.log 2>&1 &
          echo $! > /tmp/wealtharrays-http.pid
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:4173/index.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/wealtharrays-http.log
          exit 1

      - name: Run homepage search smoke test
        run: node qa/home-search-smoke.mjs

      - name: Bust browser caches for runtime assets
        run: |
          VERSION="20260915-${GITHUB_SHA::12}"
          python3 - <<'PY'
          import os, re
          version = '20260915-' + os.environ['GITHUB_SHA'][:12]
          patterns = {
              'wa-core.js': version,
              'site-runtime.js': version,
              'final-polish.js': version,
              'wa-enhancements.js': version,
          }
          for root, _, files in os.walk('.'):
              if '.git' in root or 'node_modules' in root:
                  continue
              for name in files:
                  if not name.endswith('.html'):
                      continue
                  path = os.path.join(root, name)
                  text = open(path, encoding='utf-8').read()
                  new = text
                  for asset, ver in patterns.items():
                      new = re.sub(rf'{re.escape(asset)}(?:\?v=[^"\']+)?', f'{asset}?v={ver}', new)
                  if new != text:
                      open(path, 'w', encoding='utf-8').write(new)
          PY

      - name: Commit cache-busted runtime references
        run: |
          if git diff --quiet; then
            echo 'No runtime cache-bust changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '*.html'
          git commit -m 'Bump runtime asset cache keys after browser smoke test'
          git push
