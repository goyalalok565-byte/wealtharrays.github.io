name: Homepage and production browser smoke

on:
  workflow_run:
    workflows: ["Wealth Arrays Canonical CI"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Wait for current canonical build artifacts on main
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            git fetch origin main
            if git cat-file -e FETCH_HEAD:wa-home-runtime.js 2>/dev/null &&
               git show FETCH_HEAD:index.html | grep -q '/wa-home-runtime.js?v=' &&
               git show FETCH_HEAD:tools.html | grep -q '/wa-site-runtime.js?v=' &&
               git show FETCH_HEAD:sip-calculator/index.html | grep -q '/wa-calculator-runtime.js?v='; then
              if node <<'NODE'
          const {execFileSync}=require('child_process');
          const crypto=require('crypto');
          const show=(p)=>execFileSync('git',['show',`FETCH_HEAD:${p}`],{encoding:'utf8'});
          const hash=(p)=>crypto.createHash('sha256').update(show(p).replace(/\r\n/g,'\n').trimEnd()).digest('hex').slice(0,12);
          const checks=[['wa-home-runtime.js','home','final-polish.js'],['wa-site-runtime.js','site','wa-core.js'],['wa-calculator-runtime.js','calculator','calculator-page-init.js']];
          for(const [bundlePath,label,sourcePath] of checks){
            const marker=`WA CANONICAL MODULE | ${label} | ${sourcePath} | sha256:${hash(sourcePath)}`;
            if(!show(bundlePath).includes(marker))process.exit(1);
          }
          NODE
              then
                git checkout --detach FETCH_HEAD
                echo "Checked out current canonical build commit $(git rev-parse --short HEAD)."
                exit 0
              fi
            fi
            echo "Waiting for the canonical build bot to refresh runtime bundles from current sources... attempt $i/30"
            sleep 10
          done
          echo "Current source and canonical runtime bundle provenance did not match within five minutes."
          exit 1

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start local site
        run: |
          python3 -m http.server 4173 --directory . > /tmp/wealtharrays-http.log 2>&1 &
          echo $! > /tmp/wealtharrays-http.pid
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:4173/index.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/wealtharrays-http.log
          exit 1

      - name: Run homepage search smoke against exact checkout
        run: node qa/home-search-smoke.mjs
      - name: Run embed browser smoke against exact checkout
        run: node qa/embed-browser-smoke.mjs

      - name: Run visual and calculator smoke against exact checkout
        run: node qa/production-browser-smoke.mjs

      - name: Wait for exact production runtime versions
        shell: bash
        run: |
          set -euo pipefail
          expected_home="$(grep -oE '/wa-home-runtime\\.js\\?v=[^"]+' index.html | head -n1)"
          expected_site="$(grep -oE '/wa-site-runtime\\.js\\?v=[^"]+' tools.html | head -n1)"
          expected_calc="$(grep -oE '/wa-calculator-runtime\\.js\\?v=[^"]+' sip-calculator/index.html | head -n1)"
          test -n "$expected_home" || { echo "Could not extract expected home runtime URL"; exit 1; }
          test -n "$expected_site" || { echo "Could not extract expected site runtime URL"; exit 1; }
          test -n "$expected_calc" || { echo "Could not extract expected calculator runtime URL"; exit 1; }
          for i in $(seq 1 60); do
            home="$(curl -fsSL https://wealtharrays.com/index.html 2>/dev/null || true)"
            tools="$(curl -fsSL https://wealtharrays.com/tools/ 2>/dev/null || true)"
            calc="$(curl -fsSL https://wealtharrays.com/sip-calculator/ 2>/dev/null || true)"
            if grep -Fq "$expected_home" <<<"$home" && grep -Fq "$expected_site" <<<"$tools" && grep -Fq "$expected_calc" <<<"$calc"; then
              echo "Production is serving the current home, site and calculator runtime versions."
              exit 0
            fi
            echo "Waiting for exact production runtime versions... attempt $i/60"
            sleep 10
          done
          echo "Production did not expose the current runtime versions within ten minutes."
          exit 1

      - name: Verify production embed browser smoke
        env:
          BASE_URL: https://wealtharrays.com
        run: node qa/embed-browser-smoke.mjs

      - name: Verify production homepage search
        env:
          BASE_URL: https://wealtharrays.com
        run: node qa/home-search-smoke.mjs

      - name: Verify production visual and calculator health
        env:
          BASE_URL: https://wealtharrays.com
        run: node qa/production-browser-smoke.mjs
