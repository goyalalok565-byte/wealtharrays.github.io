name: Deploy Wealth Arrays API Worker

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wealtharrays-cloudflare-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Build and validate API Worker
        run: |
          npm run build
          node --check worker.mjs
          node qa/cloudflare-worker-routing.mjs
      - name: Check deployment credentials
        id: credentials
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "$CF_API_TOKEN" ] || [ -z "$CF_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are required in the production environment or repository secrets."
            exit 1
          fi
          echo "cloudflare_ready=true" >> "$GITHUB_OUTPUT"
      - name: Install Wrangler
                run: npm install --no-save wrangler@4.97.0
      - name: Apply D1 migrations
                env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply wealtharrays-saas --remote
      - name: Deploy API Worker
                env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
      - name: Report deployment result
        if: always()
        env:
          CF_READY: ${{ steps.credentials.outputs.cloudflare_ready }}
        run: |
          {
            echo "## Wealth Arrays Worker deployment"
            if [ "$CF_READY" = "true" ]; then
              echo "- Cloudflare credentials were present; inspect preceding migration and deployment steps for their result."
            else
              echo "- Worker deployment was not performed."
            fi
            echo "- Runtime secrets are managed only by the protected Cloudflare secrets sync workflow."
            echo "- No secret values are printed."
          } >> "$GITHUB_STEP_SUMMARY"
