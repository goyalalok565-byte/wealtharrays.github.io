name: Deploy Wealth Arrays API Worker

on:
  push:
    branches: [main]
    paths:
      - "worker.mjs"
      - "wrangler.toml"
      - "functions/**"
      - "migrations/**"
      - "package.json"
      - "scripts/**"
      - "calculators.js"
      - "qa/**"
      - ".github/workflows/cloudflare-worker-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wealtharrays-cloudflare-worker
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Build and validate API Worker
        run: |
          npm run build
          node --check worker.mjs
          node qa/cloudflare-worker-routing.mjs
      - name: Check deployment credentials
        id: credentials
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
        run: |
          if [ -n "$CF_API_TOKEN" ] && [ -n "$CF_ACCOUNT_ID" ]; then
            echo "cloudflare_ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "cloudflare_ready=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$D1_DATABASE_ID" ]; then
            echo "d1_ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "d1_ready=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Configure D1 binding
        if: steps.credentials.outputs.cloudflare_ready == 'true' && steps.credentials.outputs.d1_ready == 'true'
        env:
          D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
        run: |
          printf '\n[[d1_databases]]\nbinding = "DB"\ndatabase_name = "wealtharrays-saas"\ndatabase_id = "%s"\nmigrations_dir = "./migrations"\n' "$D1_DATABASE_ID" >> wrangler.toml
          echo "D1 binding configured for deployment."
      - name: Install Wrangler
        if: steps.credentials.outputs.cloudflare_ready == 'true' && steps.credentials.outputs.d1_ready == 'true'
        run: npm install --no-save wrangler@4
      - name: Apply D1 migrations
        if: steps.credentials.outputs.cloudflare_ready == 'true' && steps.credentials.outputs.d1_ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply wealtharrays-saas --remote
      - name: Deploy API Worker
        if: steps.credentials.outputs.cloudflare_ready == 'true' && steps.credentials.outputs.d1_ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
      - name: Configure optional runtime secrets
        if: steps.credentials.outputs.cloudflare_ready == 'true' && steps.credentials.outputs.d1_ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
          RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
          RAZORPAY_PLAN_MONTHLY: ${{ secrets.RAZORPAY_PLAN_MONTHLY }}
          RAZORPAY_PLAN_YEARLY: ${{ secrets.RAZORPAY_PLAN_YEARLY }}
          RAZORPAY_WEBHOOK_SECRET: ${{ secrets.RAZORPAY_WEBHOOK_SECRET }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
        run: |
          for name in SUPABASE_URL SUPABASE_ANON_KEY RAZORPAY_KEY_ID RAZORPAY_KEY_SECRET RAZORPAY_PLAN_MONTHLY RAZORPAY_PLAN_YEARLY RAZORPAY_WEBHOOK_SECRET TURNSTILE_SECRET_KEY TURNSTILE_SITE_KEY; do
            value="${!name}"
            if [ -n "$value" ]; then
              printf '%s' "$value" | npx wrangler secret put "$name" --name wealtharrays-github-io
            fi
          done
      - name: Report actual deployment readiness
        if: always()
        env:
          CF_READY: ${{ steps.credentials.outputs.cloudflare_ready }}
          D1_READY: ${{ steps.credentials.outputs.d1_ready }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
          RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
          RAZORPAY_PLAN_MONTHLY: ${{ secrets.RAZORPAY_PLAN_MONTHLY }}
          RAZORPAY_PLAN_YEARLY: ${{ secrets.RAZORPAY_PLAN_YEARLY }}
          RAZORPAY_WEBHOOK_SECRET: ${{ secrets.RAZORPAY_WEBHOOK_SECRET }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
        run: |
          {
            echo "## Wealth Arrays API deployment readiness"
            if [ "$CF_READY" = "true" ] && [ "$D1_READY" = "true" ]; then
              echo "- Cloudflare Worker + D1 deployment prerequisites: present."
            else
              echo "- **Worker deployment: NOT performed.**"
              [ "$CF_READY" = "true" ] || echo "- Missing: CLOUDFLARE_API_TOKEN and/or CLOUDFLARE_ACCOUNT_ID."
              [ "$D1_READY" = "true" ] || echo "- Missing: CLOUDFLARE_D1_DATABASE_ID."
            fi
            [ -n "$SUPABASE_URL" ] || echo "- Missing runtime config: SUPABASE_URL (account sync unavailable)."
            [ -n "$SUPABASE_ANON_KEY" ] || echo "- Missing runtime config: SUPABASE_ANON_KEY (account sync unavailable)."
            [ -n "$RAZORPAY_KEY_ID" ] || echo "- Missing runtime config: RAZORPAY_KEY_ID (billing unavailable)."
            [ -n "$RAZORPAY_KEY_SECRET" ] || echo "- Missing runtime config: RAZORPAY_KEY_SECRET (billing unavailable)."
            [ -n "$RAZORPAY_PLAN_MONTHLY" ] || echo "- Missing runtime config: RAZORPAY_PLAN_MONTHLY (monthly plan unavailable)."
            [ -n "$RAZORPAY_PLAN_YEARLY" ] || echo "- Missing runtime config: RAZORPAY_PLAN_YEARLY (yearly plan unavailable)."
            [ -n "$RAZORPAY_WEBHOOK_SECRET" ] || echo "- Missing runtime config: RAZORPAY_WEBHOOK_SECRET (webhook verification unavailable)."
            [ -n "$TURNSTILE_SECRET_KEY" ] || echo "- Missing runtime config: TURNSTILE_SECRET_KEY (write requests remain blocked)."
            [ -n "$TURNSTILE_SITE_KEY" ] || echo "- Missing runtime config: TURNSTILE_SITE_KEY (request verification widget unavailable)."
            echo "- This report never prints secret values."
          } >> "$GITHUB_STEP_SUMMARY"
