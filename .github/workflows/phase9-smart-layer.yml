name: Phase 9 Smart Layer
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install-smart-layer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Attach smart layer
        run: |
          python3 -c 'from pathlib import Path; [Path(p).write_text(Path(p).read_text(encoding="utf-8").replace("</body>","<script src=\"smart.js\" defer></script></body>",1),encoding="utf-8") for p in Path(".").glob("*-calculator.html") if "smart.js" not in Path(p).read_text(encoding="utf-8")]'
      - name: Commit smart layer
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "wealtharrays-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*-calculator.html'
          git commit -m "Attach Phase 9 smart calculator layer"
          git push
