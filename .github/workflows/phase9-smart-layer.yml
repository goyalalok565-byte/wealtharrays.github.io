name: Phase 9 Smart Layer
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install-smart-layer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Attach smart layer to calculator pages
        shell: bash
        run: |
          set -euo pipefail
          changed=0
          for f in *-calculator.html; do
            [ -f "$f" ] || continue
            if ! grep -q 'smart.js' "$f"; then
              python3 - "$f" <<'PY'
import sys
p=sys.argv[1]
s=open(p,encoding='utf-8').read()
needle='</body>'
if needle in s:
    s=s.replace(needle,'<script src="smart.js" defer></script></body>',1)
    open(p,'w',encoding='utf-8').write(s)
PY
              changed=1
            fi
          done
          if [ "$changed" = 1 ]; then
            git config user.name 'wealtharrays-bot'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add '*-calculator.html'
            git commit -m 'Attach Phase 9 smart calculator layer'
            git push
          else
            echo 'Smart layer already attached to all calculator pages.'
          fi
