name: Wealth Arrays Canonical CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wealtharrays-canonical-${{ github.ref }}
  cancel-in-progress: true

jobs:
  canonical:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate source JavaScript
        run: find . -maxdepth 2 -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Validate Pages Functions JavaScript
        run: find functions -type f -name '*.js' -print0 | xargs -0 -n1 sh -c 'node --input-type=module --check < "$0"'
      - name: Validate Cloudflare Worker router
        run: node --check worker.mjs
      - name: Service worker privacy and auth CSP regression
        run: node qa/service-worker-privacy-audit.mjs
      - name: Privacy policy consistency audit
        run: node qa/privacy-policy-audit.mjs
      - name: Calculator regression before build
        run: node qa/calculator-regression.mjs
      - name: Independent calculator formula audit from canonical registry
        run: node qa/phase1-calculator-audit.mjs
      - name: Generate new calculator routes
        run: node scripts/generate-calculator-pages.mjs
      - name: Build canonical runtime, split definitions and sitemap
        run: node scripts/root-cause-build.mjs
      - name: India tax-year terminology audit
        run: node qa/tax-terminology-audit.mjs
      - name: Canonical embed source regression
        run: node qa/embed-regression.mjs
      - name: Run Phase 4 premium normalization
        run: node scripts/phase4-premium-build.mjs
      - name: Normalize route aliases and accessibility
        run: node scripts/fix-route-alias-links.mjs && node scripts/normalize-nested-links.mjs && node scripts/fix-accessible-names.mjs
      - name: Repair static pages and redirect shells
        run: node scripts/repair-site-integrity.mjs
      - name: Minify canonical bundles and CSS
        run: |
          npx --yes terser@5 --compress --mangle --comments '/^ ===== WA CANONICAL MODULE/' --output wa-site-runtime.js -- wa-site-runtime.js
          npx --yes terser@5 --compress --mangle --comments '/^ ===== WA CANONICAL MODULE/' --output wa-home-runtime.js -- wa-home-runtime.js
          npx --yes terser@5 --compress --mangle --comments '/^ ===== WA CANONICAL MODULE/' --output wa-calculator-runtime.js -- wa-calculator-runtime.js
          for file in styles.css phase3-seo.css phase4-premium.css cls-fixes.css; do
            npx --yes clean-css-cli@5 -O2 -o "${file}.min" "$file"
            mv "${file}.min" "$file"
          done
      - name: Version assets by content hash
        run: node scripts/version-runtime-assets.mjs
      - name: Run canonical regression gates
        run: |
          node qa/root-cause-audit.mjs
          node qa/recurring-bug-regression.mjs
          node qa/stabilization-audit.mjs
          node qa/architecture-audit.mjs
          node qa/code-quality-audit.mjs
          node qa/phase45-production-audit.mjs
          node qa/phase4-premium-audit.mjs
          node qa/value-content-audit.mjs
          node qa/decision-engine-audit.mjs
          node qa/global-platform-audit.mjs
          node qa/global-quality-gates.mjs
          node qa/golden-model-vectors.mjs
          node qa/report-reproducibility-audit.mjs
          node qa/india-tax-module-audit.mjs
          node qa/phase1-20-roadmap-audit.mjs
          node scripts/site-integrity.mjs
          node scripts/launch-readiness.mjs
          node scripts/phase10-qa.mjs
          node scripts/build-dist.mjs
          node qa/build-dist-exclusion-audit.mjs
          npm run qa:dist
          git diff --check
      - name: Verify deterministic dist build
        run: |
          set -euo pipefail
          export SOURCE_DATE_DATE="$(git log -1 --format=%cs)"
          rm -rf dist
          # Warm up generators once: the first build normalizes tracked HTML from the pre-build source state.
          npm run build
          rm -rf dist
          npm run build
          find dist -type f -printf '%P\n' | LC_ALL=C sort > /tmp/dist-first-files.txt
          (cd dist && find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum) > /tmp/dist-first-hashes.txt
          rm -rf dist
          npm run build
          find dist -type f -printf '%P\n' | LC_ALL=C sort > /tmp/dist-second-files.txt
          (cd dist && find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum) > /tmp/dist-second-hashes.txt
          diff -u /tmp/dist-first-files.txt /tmp/dist-second-files.txt
          diff -u /tmp/dist-first-hashes.txt /tmp/dist-second-hashes.txt
      - name: Generate 55-calculator built HTML audit
        env:
          SITE_ROOT: dist
          OUTPUT_CSV: /tmp/wa-built-html-audit.csv
        run: node qa/built-html-audit.mjs
      - name: Upload public dist artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wealth-arrays-dist-${{ github.sha }}
          path: dist/
          retention-days: 14
      - name: Upload 55-calculator HTML audit CSV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wealth-arrays-built-html-audit-${{ github.sha }}
          path: /tmp/wa-built-html-audit.csv
          retention-days: 14
