name: Wealth Arrays Canonical CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wealtharrays-canonical-${{ github.ref }}
  cancel-in-progress: true

jobs:
  canonical:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate source JavaScript
        run: find . -maxdepth 2 -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Calculator regression before build
        run: node qa/calculator-regression.mjs
      - name: Build canonical runtime, split definitions and sitemap
        run: node scripts/root-cause-build.mjs
      - name: Normalize route aliases and accessibility
        run: node scripts/fix-route-alias-links.mjs && node scripts/normalize-nested-links.mjs && node scripts/fix-accessible-names.mjs
      - name: Repair static pages and redirect shells
        run: node scripts/repair-site-integrity.mjs
      - name: Minify canonical bundles and CSS
        run: |
          npx --yes terser@5 --compress --mangle --comments '/^ ===== WA CANONICAL MODULE/' --output wa-site-runtime.js -- wa-site-runtime.js
          npx --yes terser@5 --compress --mangle --comments '/^ ===== WA CANONICAL MODULE/' --output wa-calculator-runtime.js -- wa-calculator-runtime.js
          for file in styles.css phase3-seo.css phase4-premium.css cls-fixes.css; do
            npx --yes clean-css-cli@5 -O2 -o "${file}.min" "$file"
            mv "${file}.min" "$file"
          done
      - name: Version assets by content hash
        run: node scripts/version-runtime-assets.mjs
      - name: Run canonical regression gates
        run: |
          node qa/recurring-bug-regression.mjs
          node qa/stabilization-audit.mjs
          node qa/architecture-audit.mjs
          node qa/code-quality-audit.mjs
          node qa/phase45-production-audit.mjs
          node qa/phase4-premium-audit.mjs
          node scripts/site-integrity.mjs
          node scripts/launch-readiness.mjs
          node scripts/phase10-qa.mjs
          git diff --check
      - name: Commit deterministic build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "wealtharrays-stabilization-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "No generated changes needed"; exit 0; fi
          git commit -m "chore: apply canonical production build [canonical-build]"
          git pull --rebase origin main
          git push origin HEAD:main
