name: Global Theme Runtime Injection

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  inject-theme-runtime:
    if: ${{ !contains(github.event.head_commit.message, '[theme-inject]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject latest theme and calculator runtime versions into every HTML page
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          theme_old='theme-fix.js?v=20260915-theme-v1'
          theme_marker='theme-fix.js?v=20260915-theme-v2'
          calculator_old='calculator-runtime.js?v=20260915-1'
          calculator_marker='calculator-runtime.js?v=20260915-2'
          theme_tag=f'<script src="/{theme_marker}" defer></script>'
          changed=[]
          for path in Path('.').rglob('*.html'):
              if any(part.startswith('.') for part in path.parts):
                  continue
              text=path.read_text(encoding='utf-8')
              original=text
              text=text.replace(theme_old, theme_marker)
              text=text.replace(calculator_old, calculator_marker)
              if theme_marker not in text:
                  if '</body>' in text:
                      text=text.replace('</body>', theme_tag+'</body>', 1)
                  elif '</head>' in text:
                      text=text.replace('</head>', theme_tag+'</head>', 1)
              if text != original:
                  path.write_text(text,encoding='utf-8')
                  changed.append(str(path))
          print('Updated runtime versions in',len(changed),'HTML files')
          for item in changed: print(item)
          PY

      - name: Commit injected runtime
        run: |
          git config user.name "wealtharrays-theme-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html'
          if git diff --cached --quiet; then
            echo "No HTML changes needed"
            exit 0
          fi
          git commit -m "chore: refresh global theme runtime [theme-inject]"
          git push
