name: Calculator runtime deployment fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-runtime-fixes:
    if: ${{ !contains(github.event.head_commit.message, '[runtime-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Normalize calculators, page shell and metadata
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('calculators.js')
          s=p.read_text()
          s=s.replace('max: 50,','max: 1000,').replace('max: 60,','max: 200,')
          p.write_text(s)

          pages=sorted(Path('.').glob('*-calculator.html'))+[Path('income-tax-planner.html')]
          tag='<script src="calculator-runtime.js?v=20260913-2" defer></script>'
          pattern=re.compile(r'<script\s+src=["\']calculator-runtime\.js(?:\?[^"\']*)?["\'][^>]*></script>',re.I)
          for p in pages:
              s=p.read_text()
              s=pattern.sub(tag,s,count=1) if pattern.search(s) else s.replace('</body>',tag+'</body>')
              p.write_text(s)

          universal='<script src="site-runtime.js?v=20260914-2" defer></script>'
          enhancements='<script src="wa-enhancements.js?v=20260914-2" defer></script>'
          all_pages=sorted(Path('.').glob('*.html'))+sorted(Path('articles').glob('*.html'))+sorted(Path('p').glob('*.html'))
          u_pattern=re.compile(r'<script\s+src=["\']site-runtime\.js(?:\?[^"\']*)?["\'][^>]*></script>',re.I)
          e_pattern=re.compile(r'<script\s+src=["\']wa-enhancements\.js(?:\?[^"\']*)?["\'][^>]*></script>',re.I)
          old_home=re.compile(r'<script\s+src=["\']home-recovery\.js(?:\?[^"\']*)?["\'][^>]*></script>',re.I)

          footer='''<footer class="site-footer premium-footer"><div class="site-footer-inner"><div class="footer-brand-row"><a class="footer-logo" href="/index.html" aria-label="Wealth Arrays home"><img src="/favicon-v2.svg" alt="Wealth Arrays logo" width="44" height="44"><span><b>Wealth Arrays</b><small>Financial tools that make numbers clearer.</small></span></a><p class="footer-brand-copy">Fast, browser-first financial calculators for clearer decisions. Results are educational estimates and not financial, tax, legal or investment advice.</p></div><nav class="footer-nav-box" aria-label="Company and legal pages"><a class="footer-link" href="/privacy.html">Privacy Policy</a><a class="footer-link" href="/terms.html">Terms &amp; Conditions</a><a class="footer-link" href="/disclaimer.html">Disclaimer</a><a class="footer-link" href="/about.html">About Us</a><a class="footer-link" href="/contact.html">Contact Us</a><a class="footer-link" href="/methodology.html">Methodology</a><a class="footer-link" href="/editorial-standards.html">Editorial Standards</a><a class="footer-link" href="/advertising-policy.html">Advertising Policy</a><a class="footer-link" href="/faq.html">FAQ</a></nav><div class="footer-bottom"><span>© 2026 Wealth Arrays</span><span>Questions or corrections: <a href="mailto:goyalalok565@gmail.com">goyalalok565@gmail.com</a></span></div></div></footer>'''
          footer_pattern=re.compile(r'<footer\b[^>]*>.*?</footer>',re.I|re.S)

          for p in all_pages:
              s=p.read_text()
              s=u_pattern.sub(universal,s,count=1) if u_pattern.search(s) else s.replace('</body>',universal+'</body>')
              s=e_pattern.sub(enhancements,s,count=1) if e_pattern.search(s) else s.replace('</body>',enhancements+'</body>')
              s=old_home.sub('',s)
              s=footer_pattern.sub(footer,s)
              if '<footer' not in s.lower(): s=s.replace('</body>',footer+'</body>')
              s=re.sub(r'<link\s+rel=["\'](?:shortcut icon|icon)["\'][^>]*>', '', s, flags=re.I)
              s=s.replace('</head>','<link rel="icon" href="/favicon-v2.svg" type="image/svg+xml" sizes="any"><link rel="shortcut icon" href="/favicon-v2.svg" type="image/svg+xml"></head>',1)
              if 'property="og:image"' not in s.lower():
                  s=s.replace('</head>','<meta property="og:image" content="https://wealtharrays.com/og-image.png"><meta property="og:image:type" content="image/png"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630"></head>',1)
              else:
                  s=re.sub(r'<meta\s+property=["\']og:image["\'][^>]*>', '<meta property="og:image" content="https://wealtharrays.com/og-image.png">', s, count=1, flags=re.I)
              for cls in ['home-tool-index','tool-num','calc-icon','category-icon','share-icon','footer-mark']:
                  s=re.sub(r'(<[^>]*class=["\'][^"\']*\b'+re.escape(cls)+r'\b[^"\']*["\'][^>]*)(>)', lambda m: m.group(1)+(' aria-hidden="true"' if 'aria-hidden=' not in m.group(1) else '')+m.group(2), s, flags=re.I)
              p.write_text(s)

          css=Path('styles.css')
          s=css.read_text()
          extra='\n/* Runtime-owned search overlay. */\n.search-bar{position:relative!important;z-index:1000!important;overflow:visible!important}\n#tool-search-results{z-index:100000!important;position:absolute!important;overflow:hidden!important}\n'
          if '/* Runtime-owned search overlay. */' not in s: css.write_text(s+extra)
          PY
      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -e
          find . -maxdepth 2 -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Commit fixes
        run: |
          git config user.name "wealth-arrays-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add calculators.js styles.css '*.html' articles/*.html p/*.html site-runtime.js wa-enhancements.js calculator-runtime.js
          git diff --cached --quiet && exit 0
          git commit -m "Fix canonical page shell and runtime ownership [runtime-fix]"
          git push
