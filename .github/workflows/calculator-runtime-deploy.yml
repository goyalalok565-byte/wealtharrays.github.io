name: Runtime validation

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: runtime-validation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          find . -maxdepth 2 -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Validate recurring bug regression contract
        shell: bash
        run: node qa/recurring-bug-regression.mjs

      - name: Validate runtime ownership and PWA contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(grep -o "function calculatorSearch" wa-core.js | wc -l)" -eq 1
          ! grep -q "function calculatorSearch" final-polish.js
          ! grep -q "function installSafeSearch" final-polish.js
          ! grep -q "waSearchFix" final-polish.js
          ! grep -q "beforeinstallprompt" site-runtime.js
          ! grep -q "function installController" site-runtime.js
          test "$(grep -o "beforeinstallprompt" wa-core.js | wc -l)" -eq 1
          grep -q "CALCULATOR_CATALOG" wa-core.js
          grep -q "data-wa-open-consent" wa-core.js
          grep -q "waInstallDismissedV2" wa-core.js
          grep -q "beforeinstallprompt" wa-core.js
          grep -q "serviceWorker.register('/sw.js'" wa-core.js
          grep -q "wealtharrays-pwa-3" sw.js
          grep -q "self.skipWaiting" sw.js
          grep -q "self.clients.claim" sw.js
          grep -q '"start_url": "/"' manifest.webmanifest
          grep -q '"display": "standalone"' manifest.webmanifest
          test -f icon-192.png
          test -f icon-512.png

      - name: Validate page shell and managed script uniqueness
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          pages=list(Path('.').glob('*.html'))+list(Path('articles').glob('*.html'))+list(Path('p').glob('*.html'))
          managed={'wa-core.js','site-runtime.js','wa-enhancements.js','final-polish.js'}
          checked=0
          skipped=0
          for p in pages:
              s=p.read_text()
              if re.search(r'<meta[^>]+name=["\']robots["\'][^>]+content=["\'][^"\']*noindex', s, re.I):
                  skipped += 1
                  continue
              checked += 1
              if s.count('<footer') != 1: raise SystemExit(f'footer count: {p}')
              if 'wealtharrays.com/og-image.png' not in s: raise SystemExit(f'missing OG image: {p}')
              scripts=re.findall(r'<script\s+src=["\']([^"\']+)["\'][^>]*></script>',s,re.I)
              names=[Path(x.split('?',1)[0]).name for x in scripts]
              for src in managed:
                  if names.count(src)>1: raise SystemExit(f'duplicate {src}: {p}')
          print(f'validated {checked} indexable HTML pages; skipped {skipped} noindex redirect shells')
          PY

      - name: Validate sitemap and robots
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'Sitemap: https://wealtharrays.com/sitemap.xml' robots.txt
          grep -q 'https://wealtharrays.com/' sitemap.xml
          test "$(grep -o '<url>' sitemap.xml | wc -l)" -ge 40
