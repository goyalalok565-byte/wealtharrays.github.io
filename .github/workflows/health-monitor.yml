name: Wealth Arrays API Health Monitor
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wealth-arrays-api-health-monitor
  cancel-in-progress: true
jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Check production API liveness and dependency status
        env:
          BASE_URL: https://wealtharrays.com
        run: node qa/health-monitor.mjs
