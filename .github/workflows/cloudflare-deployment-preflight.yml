name: Cloudflare Deployment Preflight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Validate Cloudflare token
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$CF_API_TOKEN" || { echo "::error::CLOUDFLARE_API_TOKEN is missing"; exit 1; }
          response="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            https://api.cloudflare.com/client/v4/user/tokens/verify)"
          echo "$response" | jq -e '.success == true and .result.status == "active"' >/dev/null
          echo "Cloudflare API token is active."

      - name: Validate account and D1 database access
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
        run: |
          test -n "$CF_ACCOUNT_ID" || { echo "::error::CLOUDFLARE_ACCOUNT_ID is missing"; exit 1; }
          test -n "$D1_DATABASE_ID" || { echo "::error::CLOUDFLARE_D1_DATABASE_ID is missing"; exit 1; }
          response="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/d1/database/$D1_DATABASE_ID")"
          echo "$response" | jq -e --arg id "$D1_DATABASE_ID" \
            '.success == true and .result.uuid == $id and .result.name == "wealtharrays-saas"' >/dev/null
          echo "Cloudflare account and wealtharrays-saas D1 database are accessible."

      - name: Validate application build and migrations
        run: |
          npm run build
          node --check worker.mjs
          node qa/cloudflare-worker-routing.mjs
          test -s migrations/0001_saas.sql
          test -s migrations/0002_billing_webhook_order.sql
          test -s migrations/0003_subscription_cancel_flag.sql
          test -s migrations/0004_billing_checkout_lock.sql
          echo "Build, routing audit, and all four expected migration files passed."

      - name: Report optional runtime configuration
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
          RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
          RAZORPAY_PLAN_MONTHLY: ${{ secrets.RAZORPAY_PLAN_MONTHLY }}
          RAZORPAY_PLAN_YEARLY: ${{ secrets.RAZORPAY_PLAN_YEARLY }}
          RAZORPAY_WEBHOOK_SECRET: ${{ secrets.RAZORPAY_WEBHOOK_SECRET }}
        run: |
          for name in SUPABASE_URL SUPABASE_ANON_KEY RAZORPAY_KEY_ID RAZORPAY_KEY_SECRET RAZORPAY_PLAN_MONTHLY RAZORPAY_PLAN_YEARLY RAZORPAY_WEBHOOK_SECRET; do
            if [ -n "${!name}" ]; then
              echo "- $name: configured" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "- $name: missing (related integration remains unavailable)" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          echo "Preflight is read-only: it does not apply D1 migrations or deploy the Worker." >> "$GITHUB_STEP_SUMMARY"
