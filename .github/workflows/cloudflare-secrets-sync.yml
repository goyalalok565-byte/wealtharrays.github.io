name: Cloudflare secrets sync

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wealtharrays-cloudflare-secrets-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Sync TEST runtime secrets
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Validate credentials and TEST mode
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
          RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
          RAZORPAY_WEBHOOK_SECRET: ${{ secrets.RAZORPAY_WEBHOOK_SECRET }}
          RAZORPAY_PLAN_MONTHLY: ${{ secrets.RAZORPAY_PLAN_MONTHLY }}
          RAZORPAY_PLAN_YEARLY: ${{ secrets.RAZORPAY_PLAN_YEARLY }}
        run: |
          set -euo pipefail
          set +x
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID SUPABASE_URL SUPABASE_ANON_KEY RAZORPAY_KEY_ID RAZORPAY_KEY_SECRET RAZORPAY_WEBHOOK_SECRET RAZORPAY_PLAN_MONTHLY RAZORPAY_PLAN_YEARLY; do
            value="${!name}"
            if [ -z "$value" ]; then
              echo "::error::Required environment secret is missing: $name"
              exit 1
            fi
            echo "::add-mask::$value"
          done
          case "$RAZORPAY_KEY_ID" in
            rzp_test_*) echo "Razorpay TEST key prefix verified." ;;
            *) echo "::error::Refusing secret sync: RAZORPAY_KEY_ID must begin with rzp_test_."; exit 1 ;;
          esac
          case "$SUPABASE_URL" in
            https://*) ;;
            *) echo "::error::SUPABASE_URL must be an HTTPS project URL."; exit 1 ;;
          esac

      - name: Verify Wrangler authentication
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4.97.0 whoami

      - name: Upload secrets in one bulk request
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
          RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
          RAZORPAY_WEBHOOK_SECRET: ${{ secrets.RAZORPAY_WEBHOOK_SECRET }}
          RAZORPAY_PLAN_MONTHLY: ${{ secrets.RAZORPAY_PLAN_MONTHLY }}
          RAZORPAY_PLAN_YEARLY: ${{ secrets.RAZORPAY_PLAN_YEARLY }}
        run: |
          set -euo pipefail
          set +x
          umask 077
          secret_file="$(mktemp)"
          trap 'rm -f "$secret_file"' EXIT
          node --input-type=module -e '
            const names = [
              "SUPABASE_URL", "SUPABASE_ANON_KEY", "RAZORPAY_KEY_ID",
              "RAZORPAY_KEY_SECRET", "RAZORPAY_WEBHOOK_SECRET",
              "RAZORPAY_PLAN_MONTHLY", "RAZORPAY_PLAN_YEARLY"
            ];
            const values = Object.fromEntries(names.map((name) => [name, process.env[name]]));
            process.stdout.write(JSON.stringify(values));
          ' > "$secret_file"
          npx --yes wrangler@4.97.0 secret bulk "$secret_file" --name wealtharrays-github-io

      - name: Verify runtime configuration flags only
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error --max-time 30 https://wealtharrays.com/v1/health)"
          printf '%s' "$response" | node --input-type=module -e '
            let raw = "";
            for await (const chunk of process.stdin) raw += chunk;
            const h = JSON.parse(raw);
            const flag = (v) => typeof v === "string" ? v : (v && typeof v === "object" && "status" in v ? v.status : (v === true ? "configured" : v === false ? "not_configured" : "unknown"));
            for (const key of ["d1_database", "supabase_auth", "razorpay_billing"]) {
              console.log(key + "=" + flag(h.dependencies?.[key]));
            }
            console.log("ready_for_saas=" + String(h.ready_for_saas === true));
          '
