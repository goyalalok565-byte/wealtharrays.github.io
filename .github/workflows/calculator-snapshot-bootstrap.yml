name: Bootstrap calculator output snapshots

on:
  push:
    branches:
      - test/calculator-snapshot-baseline

permissions:
  contents: write

jobs:
  bootstrap:
    if: ${{ !contains(github.event.head_commit.message, '[snapshot-baseline]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Generate baseline before runtime refactoring
        run: |
          node qa/calculator-snapshot-test.mjs --write
          node qa/calculator-snapshot-test.mjs
      - name: Commit the frozen baseline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/snapshots.json
          git commit -m "test: add deterministic calculator snapshots [snapshot-baseline]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
