name: Unit Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unit-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: unit-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Run unit tests
        run: npm test
      - name: Build production static preview
        run: npm run build
      - name: Install Playwright for consent and RUM browser smoke
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start static preview
        run: |
          python3 -m http.server 4173 --directory dist > /tmp/wa-consent-preview.log 2>&1 &
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:4173/tools.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/wa-consent-preview.log
          exit 1
      - name: Verify consent-gated GA4 and Core Web Vitals
        env:
          BASE_URL: http://127.0.0.1:4173
        run: node qa/third-party-loading-browser-smoke.mjs
