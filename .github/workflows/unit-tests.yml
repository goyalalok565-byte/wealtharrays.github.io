name: Unit Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unit-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: unit-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Run unit tests
        run: npm test
      - name: Verify account email enforcement
        run: node qa/auth-verification-audit.mjs
      - name: Verify billing webhook ordering and refund revocation
        run: node qa/billing-webhook-audit.mjs
      - name: Verify server-authoritative entitlements
        run: node qa/entitlement-audit.mjs
      - name: Verify Worker CORS, rate limits and Turnstile
        run: node qa/cloudflare-worker-routing.mjs
      - name: Verify cloud workspace Turnstile integration
        run: node qa/cloud-workspace-sync-audit.mjs
