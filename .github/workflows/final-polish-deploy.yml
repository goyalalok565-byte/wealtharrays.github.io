name: Wealth Arrays production validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate production runtime
        run: |
          set -euo pipefail
          test ! -e ux-fix.js
          test ! -e interaction-fix.js
          test ! -e home-recovery.js
          test ! -e interaction-fix.css
          ! grep -R -n -E 'ux-fix\.js|interaction-fix\.js|interaction-fix\.css' --include='*.html' .
          ! grep -q 'function calculatorSearch' final-polish.js
          ! grep -q 'function installSafeSearch' final-polish.js
          ! grep -q 'waSearchFix' final-polish.js
          ! grep -q 'beforeinstallprompt' site-runtime.js
          ! grep -q 'function installController' site-runtime.js
          test "$(grep -o 'function calculatorSearch' wa-core.js | wc -l)" -eq 1
          test "$(grep -o 'beforeinstallprompt' wa-core.js | wc -l)" -eq 1
          find . -maxdepth 2 -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          python3 - <<'PY'
          from pathlib import Path
          import re
          managed={'wa-core.js','site-runtime.js','wa-enhancements.js','calculator-runtime.js','final-polish.js'}
          pages=list(Path('.').glob('*.html'))+list(Path('articles').glob('*.html'))+list(Path('p').glob('*.html'))
          for p in pages:
              s=p.read_text()
              assert s.count('rel="manifest"')==1, p
              scripts=re.findall(r'<script\s+src=["\']([^"\']+)["\'][^>]*></script>',s,re.I)
              names=[Path(x.split('?',1)[0]).name for x in scripts]
              for src in managed: assert names.count(src)<=1, (p,src,names)
          core=Path('wa-core.js').read_text()
          assert 'const CALCULATOR_CATALOG' in core
          assert "const host=document.querySelector('.calc-page')" in core
          assert 'data-wa-open-consent' in core
          assert 'waInstallDismissedV2' in core
          assert 'beforeinstallprompt' in core
          assert 'wealtharrays-pwa-3' in Path('sw.js').read_text()
          PY
          git diff --check
