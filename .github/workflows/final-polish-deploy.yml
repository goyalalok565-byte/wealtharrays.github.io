name: Wealth Arrays final polish deployment

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  polish:
    if: ${{ !contains(github.event.head_commit.message, '[final-polish]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inject final polish and UX runtime
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          tags = {
            'final-polish.js': '<script src="final-polish.js?v=20260914-3" defer></script>',
            'ux-fix.js': '<script src="ux-fix.js?v=20260914-1" defer></script>',
            'interaction-fix.js': '<script src="interaction-fix.js?v=20260914-3" defer></script>'
          }
          pages = sorted(Path('.').glob('*.html')) + sorted(Path('articles').glob('*.html'))
          for p in pages:
              s = p.read_text()
              for name, tag in tags.items():
                  stem = re.escape(name[:-3])
                  pattern = re.compile(r'<script\s+src=["\']' + stem + r'\.js(?:\?[^"\']*)?["\'][^>]*></script>', re.I)
                  s = pattern.sub(tag, s, count=1) if pattern.search(s) else s.replace('</body>', tag + '</body>')
              css_tag = '<link rel="stylesheet" href="interaction-fix.css?v=20260914-2"> '
              css_pattern = re.compile(r'<link\s+rel=["\']stylesheet["\']\s+href=["\']interaction-fix\.css(?:\?[^"\']*)?["\'][^>]*>', re.I)
              s = css_pattern.sub(css_tag, s, count=1) if css_pattern.search(s) else s.replace('</head>', css_tag + '</head>', 1)
              p.write_text(s)
          PY
      - name: Validate interaction assets
        run: |
          node --check interaction-fix.js
          test -s interaction-fix.css
      - name: Commit
        run: |
          git config user.name "wealth-arrays-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add final-polish.js ux-fix.js interaction-fix.js interaction-fix.css '*.html' articles/*.html
          git diff --cached --quiet && exit 0
          git commit -m "Apply final polish fixes [final-polish]"
          git push
