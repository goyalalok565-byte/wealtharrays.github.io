name: Wealth Arrays final polish deployment

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  polish:
    if: ${{ !contains(github.event.head_commit.message, '[final-polish]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Normalize shared runtime references
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          pages = sorted(Path('.').glob('*.html')) + sorted(Path('articles').glob('*.html'))
          for p in pages:
              s = p.read_text()
              s = re.sub(r'<script\s+src=["\'][^"\']*(?:ux-fix|interaction-fix)\.js(?:\?[^"\']*)?["\'][^>]*></script>\s*', '', s, flags=re.I)
              s = re.sub(r'<link\s+rel=["\']stylesheet["\']\s+href=["\'][^"\']*interaction-fix\.css(?:\?[^"\']*)?["\'][^>]*>\s*', '', s, flags=re.I)
              s = re.sub(r'<link\s+rel=["\']manifest["\'][^>]*>\s*', '', s, flags=re.I)
              s = s.replace('</head>', '<link rel="manifest" href="/manifest.webmanifest"></head>', 1)
              tag = '<script src="final-polish.js?v=20260914-3" defer></script>'
              pattern = re.compile(r'<script\s+src=["\']final-polish\.js(?:\?[^"\']*)?["\'][^>]*></script>', re.I)
              s = pattern.sub(tag, s, count=1) if pattern.search(s) else s.replace('</body>', tag + '</body>')
              p.write_text(s)
          PY
      - name: Validate cleanup only
        run: |
          set -euo pipefail
          test ! -e ux-fix.js
          test ! -e interaction-fix.js
          test ! -e home-recovery.js
          test ! -e interaction-fix.css
          ! grep -R -n -E 'ux-fix\.js|interaction-fix\.js|interaction-fix\.css' --include='*.html' .
          node --check wa-core.js
          git diff --check
      - name: Commit normalized site
        run: |
          git config user.name "wealth-arrays-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html' articles/*.html final-polish.js .github/workflows/final-polish-deploy.yml
          git diff --cached --quiet && exit 0
          git commit -m "Normalize shared runtime ownership [final-polish]"
          git push
