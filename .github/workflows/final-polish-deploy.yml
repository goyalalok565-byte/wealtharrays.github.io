name: Wealth Arrays final polish deployment

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  polish:
    if: ${{ !contains(github.event.head_commit.message, '[final-polish]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Keep shared runtime production-safe
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          core=Path('wa-core.js')
          s=core.read_text()
          old="const host = document.querySelector('.calc-page') || document.querySelector('.tool-article') || document.querySelector('main');"
          new="const host = document.querySelector('.calc-page');"
          if old in s:
              s=s.replace(old,new,1)
          core.write_text(s)
          PY

      - name: Validate production build
        run: |
          set -euo pipefail
          test ! -e ux-fix.js
          test ! -e interaction-fix.js
          test ! -e home-recovery.js
          test ! -e interaction-fix.css
          ! grep -R -n -E 'ux-fix\.js|interaction-fix\.js|interaction-fix\.css' --include='*.html' .
          node --check wa-core.js
          node --check sw.js
          node --check site-runtime.js
          node --check calculator-runtime.js
          node --check wa-enhancements.js
          node --check final-polish.js
          python3 - <<'PY'
          from pathlib import Path
          import re
          pages=sorted(Path('.').glob('*.html'))+sorted(Path('articles').glob('*.html'))
          managed={'wa-core.js','site-runtime.js','final-polish.js','wa-enhancements.js','calculator-runtime.js','calculators.js','widget.js','smart.js'}
          for p in pages:
              s=p.read_text()
              assert s.count('rel="manifest"')==1, p
              scripts=re.findall(r'<script\s+src=["\']([^"\']+)["\'][^>]*></script>',s,re.I)
              names=[Path(x.split('?',1)[0]).name for x in scripts]
              for src in managed:
                  assert names.count(src)<=1, (p,src,names)
          core=Path('wa-core.js').read_text()
          assert 'const CALCULATOR_CATALOG' in core
          assert "const host = document.querySelector('.calc-page');" in core
          assert 'data-wa-open-consent' in core
          assert 'bottom:92px' in core
          assert '7*24*60*60*1000' in core
          assert 'wealtharrays-pwa-2' in Path('sw.js').read_text()
          PY
          git diff --check

      - name: Commit normalized production build
        run: |
          git config user.name "wealth-arrays-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Production hardening: calculator search scope [final-polish]"
          git push
