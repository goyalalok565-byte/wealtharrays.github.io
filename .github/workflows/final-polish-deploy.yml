name: Wealth Arrays final polish deployment

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  polish:
    if: ${{ !contains(github.event.head_commit.message, '[final-polish]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply production hardening
        run: python3 .github/scripts/production_hardening.py

      - name: Validate production build
        run: |
          set -euo pipefail
          test ! -e ux-fix.js
          test ! -e interaction-fix.js
          test ! -e home-recovery.js
          test ! -e interaction-fix.css
          ! grep -R -n -E 'ux-fix\.js|interaction-fix\.js|interaction-fix\.css' --include='*.html' .
          node --check wa-core.js
          node --check sw.js
          node --check site-runtime.js
          node --check calculator-runtime.js
          node --check wa-enhancements.js
          node --check final-polish.js
          python3 - <<'PY'
          from pathlib import Path
          import re
          pages=sorted(Path('.').glob('*.html'))+sorted(Path('articles').glob('*.html'))
          for p in pages:
              s=p.read_text()
              assert s.count('rel="manifest"')==1, p
              for src in ['wa-core.js','site-runtime.js','final-polish.js','wa-enhancements.js','calculator-runtime.js','calculators.js','widget.js','smart.js']:
                  assert len(re.findall(r'<script\s+src=["\'][^"\']*'+re.escape(src)+r'(?:\?[^"\']*)?["\']',s,re.I))<=1, (p,src)
          core=Path('wa-core.js').read_text()
          assert 'CALCULATOR_CATALOG' in core
          assert 'data-wa-open-consent' in core
          assert 'bottom:92px' in core
          assert '7*24*60*60*1000' in core
          sw=Path('sw.js').read_text()
          assert 'wealtharrays-pwa-2' in sw
          PY
          git diff --check

      - name: Remove CI helper after successful hardening
        run: rm -f .github/scripts/production_hardening.py

      - name: Commit normalized production build
        run: |
          git config user.name "wealth-arrays-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html' articles/*.html wa-core.js sw.js RELEASE-AUDIT.json .github/workflows/final-polish-deploy.yml .github/scripts/production_hardening.py
          git diff --cached --quiet && exit 0
          git commit -m "Production hardening: universal search, privacy choices, PWA, performance [final-polish]"
          git push
