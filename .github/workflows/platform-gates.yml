name: Wealth Arrays Platform Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wealtharrays-platform-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  platform:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate JavaScript
        run: find . -maxdepth 2 -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Validate Pages Functions JavaScript
        run: find functions -type f -name '*.js' -print0 | xargs -0 -n1 sh -c 'node --input-type=module --check < "$0"'
      - name: Validate Cloudflare Worker router
        run: node --check worker.mjs
      - name: Service worker privacy and auth CSP regression
        run: node qa/service-worker-privacy-audit.mjs
      - name: Privacy policy consistency audit
        run: node qa/privacy-policy-audit.mjs
      - name: Synchronize canonical calculator registry
        run: node scripts/sync-calculator-catalog.mjs
      - name: Calculator regression and catalogue parity
        run: node qa/calculator-regression.mjs
      - name: Generate research datasets
        run: node scripts/generate-research-datasets.mjs
      - name: Phase 1-20 platform audit
        run: node qa/platform-phase1-20-audit.mjs
      - name: Phase 1-20 roadmap audit
        run: node qa/phase1-20-roadmap-audit.mjs
      - name: Research data audit
        run: node qa/research-data-audit.mjs
      - name: Accessibility static audit
        run: node qa/accessibility-static-audit.mjs
      - name: Tax-year Section 156 label regression
        run: node qa/tax-section-label-regression.mjs
      - name: Run API/page parity for all registered calculators
        run: node qa/api-calculator-parity.mjs
      - name: Build production dist
        run: npm run build
      - name: Canonical embed source regression
        run: node qa/embed-regression.mjs
      - name: Minify production bundles before browser measurement
        run: |
          for file in wa-site-runtime.js wa-home-runtime.js wa-calculator-runtime.js; do
            npx --yes terser@5 --compress --mangle --comments '/^ ===== WA CANONICAL MODULE/' --output "$file" -- "$file"
            cp "$file" "dist/$file"
          done
          node qa/performance-budget-audit.mjs
          npm run qa:dist
      - name: Install Playwright for all-calculator browser regression
        run: |
          npm install --no-save playwright@1.55.0 lighthouse@13.0.1
          npx playwright install --with-deps chromium
      - name: Start built site for browser regression
        run: |
          python3 -m http.server 4173 --directory dist > /tmp/wealtharrays-dist-http.log 2>&1 &
          echo $! > /tmp/wealtharrays-dist-http.pid
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:4173/index.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/wealtharrays-dist-http.log
          exit 1
      - name: Capture production baseline homepage CPU profile (before)
        continue-on-error: true
        env:
          BASE_URL: https://wealtharrays.com
          PROFILE_PATH: /
          LH_OUTPUT_DIR: /tmp/wa-lighthouse/before
        run: node qa/performance-profile.mjs
      - name: Capture production baseline CPU profile /tools.html (before)
        continue-on-error: true
        env:
          BASE_URL: https://wealtharrays.com
          PROFILE_PATH: /tools.html
          LH_OUTPUT_DIR: /tmp/wa-lighthouse/before
        run: node qa/performance-profile.mjs
      - name: Capture production baseline CPU profile /sip-calculator/ (before)
        continue-on-error: true
        env:
          BASE_URL: https://wealtharrays.com
          PROFILE_PATH: /sip-calculator/
          LH_OUTPUT_DIR: /tmp/wa-lighthouse/before
        run: node qa/performance-profile.mjs
      - name: Capture production baseline CPU profile /swp-calculator/ (before)
        continue-on-error: true
        env:
          BASE_URL: https://wealtharrays.com
          PROFILE_PATH: /swp-calculator/
          LH_OUTPUT_DIR: /tmp/wa-lighthouse/before
        run: node qa/performance-profile.mjs
      - name: Capture production baseline CPU profile /fire-calculator/ (before)
        continue-on-error: true
        env:
          BASE_URL: https://wealtharrays.com
          PROFILE_PATH: /fire-calculator/
          LH_OUTPUT_DIR: /tmp/wa-lighthouse/before
        run: node qa/performance-profile.mjs
      - name: Capture production baseline CPU profile /rent-vs-buy-calculator/ (before)
        continue-on-error: true
        env:
          BASE_URL: https://wealtharrays.com
          PROFILE_PATH: /rent-vs-buy-calculator/
          LH_OUTPUT_DIR: /tmp/wa-lighthouse/before
        run: node qa/performance-profile.mjs
      - name: Capture production baseline Lighthouse for six pages (before)
        continue-on-error: true
        env:
          BASE_URL: https://wealtharrays.com
          LH_OUTPUT_DIR: /tmp/wa-lighthouse/before
        run: node qa/mobile-lighthouse-baseline.mjs
      - name: Capture candidate homepage CPU profile (after)
        env:
          BASE_URL: http://127.0.0.1:4173
          PROFILE_PATH: /
          LH_OUTPUT_DIR: /tmp/wa-lighthouse/after
        run: node qa/performance-profile.mjs
      - name: Capture candidate CPU profile /tools.html (after)
        env:
          BASE_URL: http://127.0.0.1:4173
          PROFILE_PATH: /tools.html
          LH_OUTPUT_DIR: /tmp/wa-lighthouse/after
        run: node qa/performance-profile.mjs
      - name: Capture candidate CPU profile /sip-calculator/ (after)
        env:
          BASE_URL: http://127.0.0.1:4173
          PROFILE_PATH: /sip-calculator/
          LH_OUTPUT_DIR: /tmp/wa-lighthouse/after
        run: node qa/performance-profile.mjs
      - name: Capture candidate CPU profile /swp-calculator/ (after)
        env:
          BASE_URL: http://127.0.0.1:4173
          PROFILE_PATH: /swp-calculator/
          LH_OUTPUT_DIR: /tmp/wa-lighthouse/after
        run: node qa/performance-profile.mjs
      - name: Capture candidate CPU profile /fire-calculator/ (after)
        env:
          BASE_URL: http://127.0.0.1:4173
          PROFILE_PATH: /fire-calculator/
          LH_OUTPUT_DIR: /tmp/wa-lighthouse/after
        run: node qa/performance-profile.mjs
      - name: Capture candidate CPU profile /rent-vs-buy-calculator/ (after)
        env:
          BASE_URL: http://127.0.0.1:4173
          PROFILE_PATH: /rent-vs-buy-calculator/
          LH_OUTPUT_DIR: /tmp/wa-lighthouse/after
        run: node qa/performance-profile.mjs
      - name: Prove Lighthouse gate rejects deliberately failing metrics
        run: node --test qa/performance-thresholds.test.mjs
      - name: Browser regression for canonical calculator embed route
        env:
          BASE_URL: http://127.0.0.1:4173
        run: node qa/embed-browser-smoke.mjs
      - name: Browser regression for all registered calculators and scenario features
        env:
          BASE_URL: http://127.0.0.1:4173
        run: node qa/production-browser-smoke.mjs
      - name: Browser regression for cloud workspace sync
        env:
          BASE_URL: http://127.0.0.1:4173
        run: node qa/cloud-workspace-sync-browser-smoke.mjs
      - name: Dist integrity
        run: npm run qa:dist
      - name: Diff check
        run: git diff --check
      - name: Enforce mobile Lighthouse budgets on six candidate pages
        env:
          BASE_URL: http://127.0.0.1:4173
          LH_OUTPUT_DIR: /tmp/wa-lighthouse/after
        run: node qa/mobile-lighthouse-baseline.mjs
      - name: Upload before/after mobile performance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wealtharrays-before-after-mobile-performance-attempt-${{ github.run_attempt }}
          path: |
            /tmp/wa-lighthouse/
            docs/audits/content-quality-audit.md
            docs/audits/deploy-file-manifest.md
          retention-days: 30
