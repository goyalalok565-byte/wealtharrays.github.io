name: Wealth Arrays Platform Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wealtharrays-platform-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  platform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate JavaScript
        run: find . -maxdepth 2 -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Validate Pages Functions JavaScript
        run: find functions -type f -name '*.js' -print0 | xargs -0 -n1 sh -c 'node --input-type=module --check < "$0"'
      - name: Validate Cloudflare Worker router
        run: node --check worker.mjs
      - name: Calculator regression and catalogue parity
        run: node qa/calculator-regression.mjs
      - name: Generate research datasets
        run: node scripts/generate-research-datasets.mjs
      - name: Phase 1-20 platform audit
        run: node qa/platform-phase1-20-audit.mjs
      - name: Phase 1-20 roadmap audit
        run: node qa/phase1-20-roadmap-audit.mjs
      - name: Research data audit
        run: node qa/research-data-audit.mjs
      - name: Accessibility static audit
        run: node qa/accessibility-static-audit.mjs
      - name: Performance budget audit
        run: node qa/performance-budget-audit.mjs
      - name: Build production dist
        run: npm run build:dist
      - name: Install Playwright for all-calculator browser regression
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start built site for browser regression
        run: |
          python3 -m http.server 4173 --directory dist > /tmp/wealtharrays-dist-http.log 2>&1 &
          echo $! > /tmp/wealtharrays-dist-http.pid
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:4173/index.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/wealtharrays-dist-http.log
          exit 1
      - name: Browser regression for all 47 calculators and scenario features
        env:
          BASE_URL: http://127.0.0.1:4173
        run: node qa/production-browser-smoke.mjs
      - name: Dist integrity
        run: npm run qa:dist
      - name: Diff check
        run: git diff --check
      - name: Verify literal npm run build
        run: npm run build
      - name: Verify package build output after npm run build
        run: npm run qa:dist
