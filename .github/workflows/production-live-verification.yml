name: Production live verification

on:
  workflow_run:
    workflows: ["Wealth Arrays Canonical CI"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  checks: read

jobs:
  live:
    if: ${{ (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPECTED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact merge commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Wait up to 15 minutes for the exact Workers Build deployment
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            checks="$(gh api "repos/$GITHUB_REPOSITORY/commits/$EXPECTED_SHA/check-runs")"
            conclusion="$(jq -r '[.check_runs[] | select(.name == "Workers Builds: wealtharrays-github-io" and .app.slug == "cloudflare-workers-and-pages")][0].conclusion // empty' <<<"$checks")"
            if [[ "$conclusion" == "success" ]]; then
              echo "Cloudflare Workers Builds succeeded on $EXPECTED_SHA."
              exit 0
            fi
            if [[ "$conclusion" == "failure" || "$conclusion" == "cancelled" || "$conclusion" == "timed_out" || "$conclusion" == "action_required" ]]; then
              echo "Workers Builds concluded $conclusion for $EXPECTED_SHA. Deployment is not confirmed; no live smoke will run."
              exit 1
            fi
            echo "Waiting for Workers Builds on $EXPECTED_SHA (attempt $attempt/90; current conclusion: ${conclusion:-pending})."
            sleep 10
          done
          echo "Workers Builds did not confirm the exact merge SHA within 15 minutes. No live smoke was run."
          exit 1

      - name: Verify live routes, merge provenance, calculator shells and response headers
        env:
          EXPECTED_SHA: ${{ env.EXPECTED_SHA }}
          BASE_URL: https://wealtharrays.com
        run: node qa/production-live-verification.mjs
