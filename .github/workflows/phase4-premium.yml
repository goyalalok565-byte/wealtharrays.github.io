name: Phase 4 Premium Hardening

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  phase4:
    if: ${{ !contains(github.event.head_commit.message, '[phase4-build]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply premium build
        run: node scripts/phase4-premium-build.mjs
      - name: Run Phase 4 audit
        run: node qa/phase4-premium-audit.mjs
      - name: Commit hardening build
        run: |
          git config user.name "wealtharrays-phase4-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html' 'articles/*.html' 'categories/*.html' 'phase4-premium.css' 'phase4-premium.js' 'theme-init.js' 'calculator-page-init.js' '404-runtime.js'
          if git diff --cached --quiet; then
            echo "No Phase 4 build changes needed"
            exit 0
          fi
          git commit -m "chore: apply Phase 4 premium hardening [phase4-build]"
          git push

# Trigger final Phase 4 production build and certification.
