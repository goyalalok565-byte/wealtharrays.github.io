name: Homepage search browser smoke

on:
  workflow_run:
    workflows: ["Wealth Arrays Canonical CI"]
    types: [completed]

permissions:
  contents: read

jobs:
  smoke:
    if: ${{ (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[stabilization-build]')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout stabilized main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Wait for canonical build artifacts on main
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            git fetch origin main
            if git cat-file -e FETCH_HEAD:wa-home-runtime.js 2>/dev/null &&
               git show FETCH_HEAD:index.html | grep -q '/wa-home-runtime.js?v=' &&
               git show FETCH_HEAD:tools.html | grep -q '/wa-site-runtime.js?v=' &&
               git show FETCH_HEAD:sip-calculator/index.html | grep -q '/wa-calculator-runtime.js?v='; then
              git checkout --detach FETCH_HEAD
              echo "Checked out canonical build commit $(git rev-parse --short HEAD)."
              exit 0
            fi
            echo "Waiting for the canonical build bot to commit generated runtime artifacts... attempt $i/30"
            sleep 10
          done
          echo "Canonical runtime artifacts did not appear on main within five minutes."
          exit 1

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start local site
        run: |
          python3 -m http.server 4173 --directory . > /tmp/wealtharrays-http.log 2>&1 &
          echo $! > /tmp/wealtharrays-http.pid
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:4173/index.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/wealtharrays-http.log
          exit 1

      - name: Homepage search browser smoke
        run: node qa/home-search-smoke.mjs
      - name: Embed browser smoke
        run: node qa/embed-browser-smoke.mjs

      - name: Visual and calculator browser smoke
        run: node qa/production-browser-smoke.mjs

      - name: Wait for exact canonical runtime and widget route to reach production
        shell: bash
        run: |
          set -euo pipefail
          expected_home="$(grep -oE '/wa-home-runtime\.js\?v=[^"]+' index.html | head -n1)"
          expected_site="$(grep -oE '/wa-site-runtime\.js\?v=[^"]+' tools.html | head -n1)"
          expected_calc="$(grep -oE '/wa-calculator-runtime\.js\?v=[^"]+' sip-calculator/index.html | head -n1)"
          test -n "$expected_home" || { echo "Could not extract expected home runtime URL from index.html"; exit 1; }
          test -n "$expected_site" || { echo "Could not extract expected site runtime URL from tools.html"; exit 1; }
          test -n "$expected_calc" || { echo "Could not extract expected calculator runtime URL from sip-calculator/index.html"; exit 1; }
          echo "Expected home runtime: $expected_home"
          echo "Expected site runtime: $expected_site"
          echo "Expected calculator runtime: $expected_calc"
          for i in $(seq 1 60); do
            home="$(curl -fsSL https://wealtharrays.com/index.html 2>/dev/null || true)"
            tools="$(curl -fsSL https://wealtharrays.com/tools/ 2>/dev/null || true)"
            calc="$(curl -fsSL https://wealtharrays.com/sip-calculator/ 2>/dev/null || true)"
            widget_final="$(curl -sSL -o /dev/null -w '%{url_effective}' 'https://wealtharrays.com/widget.html?calc=sip' || true)"
            widget="$(curl -fsSL 'https://wealtharrays.com/widget.html?calc=sip' 2>/dev/null || true)"
            if grep -Fq "$expected_home" <<<"$home" && grep -Fq "$expected_site" <<<"$tools" && grep -Fq "$expected_calc" <<<"$calc" && [[ "$widget_final" == *'/widget.html?calc=sip' ]] && grep -q '/widget-bootstrap.js' <<<"$widget" && grep -q 'wa-calculator-runtime.js' <<<"$widget"; then
              echo "Production is serving exact home/site/calculator runtimes and the canonical widget route."
              exit 0
            fi
            echo "Waiting for exact production deployment... attempt $i/60 (widget URL: $widget_final)"
            sleep 10
          done
          echo "Production did not expose the exact current runtime versions and canonical widget route within the wait window."
          echo "This is a deployment/CDN/redirect mismatch, not a passing smoke test."
          exit 1

      - name: Production embed browser smoke
        env:
          BASE_URL: https://wealtharrays.com
        run: node qa/embed-browser-smoke.mjs

      - name: Production homepage search smoke
        env:
          BASE_URL: https://wealtharrays.com
        run: node qa/home-search-smoke.mjs

      - name: Production visual and calculator smoke
        env:
          BASE_URL: https://wealtharrays.com
        run: node qa/production-browser-smoke.mjs
