name: Homepage search browser smoke

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Wealth Arrays Stabilization Build"]
    types: [completed]

permissions:
  contents: read

jobs:
  smoke:
    if: ${{ (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[stabilization-build]')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout stabilized main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start local site
        run: |
          python3 -m http.server 4173 --directory . > /tmp/wealtharrays-http.log 2>&1 &
          echo $! > /tmp/wealtharrays-http.pid
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:4173/index.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/wealtharrays-http.log
          exit 1

      - name: Homepage search browser smoke
        run: node qa/home-search-smoke.mjs

      - name: Visual and calculator browser smoke
        run: node qa/production-browser-smoke.mjs

      - name: Wait for canonical runtime to reach production
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            home="$(curl -fsSL https://wealtharrays.com/index.html 2>/dev/null || true)"
            calc="$(curl -fsSL https://wealtharrays.com/sip-calculator.html 2>/dev/null || true)"
            if grep -q 'wa-site-runtime.js' <<<"$home" && grep -q 'wa-calculator-runtime.js' <<<"$calc"; then
              echo "Production is serving canonical site and calculator runtimes."
              exit 0
            fi
            echo "Waiting for production deployment... attempt $i/60"
            sleep 10
          done
          echo "Production did not expose canonical runtime bundles within the wait window."
          exit 1

      - name: Production homepage search smoke
        env:
          BASE_URL: https://wealtharrays.com
        run: node qa/home-search-smoke.mjs

      - name: Production visual and calculator smoke
        env:
          BASE_URL: https://wealtharrays.com
        run: node qa/production-browser-smoke.mjs
