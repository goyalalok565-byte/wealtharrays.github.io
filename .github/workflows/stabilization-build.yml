name: Wealth Arrays Stabilization Build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: wealtharrays-production-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stabilize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build canonical runtime
        run: node scripts/phase-stabilization-build.mjs

      - name: Validate canonical runtime
        run: node qa/stabilization-audit.mjs

      - name: Commit deterministic build
        run: |
          set -euo pipefail
          git config user.name "wealtharrays-stabilization-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No stabilization changes needed"
            exit 0
          fi
          git commit -m "chore: apply deterministic stabilization build [stabilization-build]"
          git pull --rebase origin main
          git push origin HEAD:main
