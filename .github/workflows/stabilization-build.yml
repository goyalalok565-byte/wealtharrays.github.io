name: Wealth Arrays Stabilization Build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: wealtharrays-production-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stabilize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate source JavaScript
        run: |
          set -euo pipefail
          find . -maxdepth 2 -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Run calculator regression suite before build
        run: node qa/calculator-regression.mjs
      - name: Build canonical runtime
        run: node scripts/phase-stabilization-build.mjs
      - name: Normalize legacy route alias links
        run: node scripts/fix-route-alias-links.mjs
      - name: Normalize nested canonical links
        run: node scripts/normalize-nested-links.mjs
      - name: Minify production calculator bundle
        run: npx --yes terser@5 --compress --mangle --comments '/^ ===== WA CANONICAL MODULE/' --output wa-calculator-runtime.js -- wa-calculator-runtime.js
      - name: Version runtime assets by content hash
        run: node scripts/version-runtime-assets.mjs
      - name: Run recurring-bug regression gate
        run: node qa/recurring-bug-regression.mjs
      - name: Validate canonical runtime
        run: node qa/stabilization-audit.mjs
      - name: Run architecture audit
        run: node qa/architecture-audit.mjs
      - name: Run source code quality audit
        run: node qa/code-quality-audit.mjs
      - name: Run Phase 4-5 production gate
        run: node qa/phase45-production-audit.mjs
      - name: Verify repository diff hygiene
        run: git diff --check
      - name: Commit deterministic build
        run: |
          set -euo pipefail
          git config user.name "wealtharrays-stabilization-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No stabilization changes needed"
            exit 0
          fi
          git commit -m "chore: apply deterministic stabilization build [stabilization-build]"
          git pull --rebase origin main
          git push origin HEAD:main
