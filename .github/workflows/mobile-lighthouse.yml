name: Mobile Lighthouse Quality Gate

on:
  workflow_run:
    workflows: ["Wealth Arrays Canonical CI"]
    types: [completed]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lighthouse:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build PR preview
        if: ${{ github.event_name == 'pull_request' }}
        run: npm run build
      - name: Start PR preview server
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          python3 -m http.server 4173 --directory dist >/tmp/wa-preview.log 2>&1 &
          echo $! >/tmp/wa-preview.pid
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/wa-preview.log
          exit 1
      - name: Wait for production routes
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          set -euo pipefail
          routes=(/ /tools.html /sip-calculator/ /swp-calculator/ /fire-calculator/ /rent-vs-buy-calculator/ /articles/compound-interest-guide.html)
          for route in "${routes[@]}"; do
            curl -fsSL --max-time 30 "https://wealtharrays.com$route" >/dev/null
          done
      - name: Install browser measurement tools
        run: |
          npm install --no-save lighthouse@13.0.1 playwright
          npx playwright install chromium --with-deps
      - name: Run seven-page mobile Lighthouse baseline
        env:
          BASE_URL: ${{ github.event_name == 'pull_request' && 'http://127.0.0.1:4173' || 'https://wealtharrays.com' }}
          LH_OUTPUT_DIR: /tmp/wa-lighthouse
        run: node qa/mobile-lighthouse-baseline.mjs
      - name: Enforce mobile quality thresholds
        run: node qa/lighthouse-quality-gate.mjs /tmp/wa-lighthouse/summary.json
      - name: Capture SWP typing and scroll CPU profile
        env:
          BASE_URL: ${{ github.event_name == 'pull_request' && 'http://127.0.0.1:4173' || 'https://wealtharrays.com' }}
        run: node qa/performance-profile.mjs
      - name: Upload Lighthouse and CPU profile reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wealth-arrays-seven-page-mobile-performance
          path: /tmp/wa-lighthouse/
          retention-days: 14
