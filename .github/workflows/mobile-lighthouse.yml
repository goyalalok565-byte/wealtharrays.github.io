name: Mobile Lighthouse Quality Gate
on:
  workflow_run:
    workflows: ["Wealth Arrays Canonical CI"]
    types: [completed]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mobile-lighthouse-${{ github.event.pull_request.number || github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: true
jobs:
  lighthouse:
    if: ${{ (github.event_name == 'workflow_dispatch' && (startsWith(github.ref, 'refs/heads/release/phase0-clean') || startsWith(github.ref, 'refs/heads/phase0/pr-c') || startsWith(github.ref, 'refs/heads/saas/l2-'))) || (github.event_name == 'pull_request' && (startsWith(github.head_ref, 'release/phase0-clean') || startsWith(github.head_ref, 'phase0/pr-c') || startsWith(github.head_ref, 'saas/l2-'))) || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || (github.event_name == 'workflow_dispatch' && github.ref) || 'main' }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Verify mobile release gate rejects threshold violations
        run: node --test tests/lighthouse-quality-gate.test.js
      - name: Build PR preview
        if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
        run: npm run build
      - name: Start PR preview server
        if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
        run: |
          nohup node qa/performance-preview-server.mjs --root dist --port 4173 >/tmp/wa-preview.log 2>&1 &
          echo $! >/tmp/wa-preview.pid
          for attempt in {1..30}; do
            if curl -fsSI -H 'Accept-Encoding: br' http://127.0.0.1:4173/ | grep -qi '^content-encoding: br'; then exit 0; fi
            sleep 1
          done
          cat /tmp/wa-preview.log
          exit 1
      - name: Wait for production routes
        if: ${{ github.event_name != 'pull_request' && github.event_name != 'workflow_dispatch' }}
        run: |
          set -euo pipefail
          routes=(/ /tools.html /sip-calculator/ /swp-calculator/ /fire-calculator/ /rent-vs-buy-calculator/ /articles/compound-interest-guide.html)
          for route in "${routes[@]}"; do curl -fsSL --max-time 30 "https://wealtharrays.com$route" >/dev/null; done
      - name: Install browser measurement tools
        run: |
          npm install --no-save lighthouse@13.0.1 playwright
          npx playwright install chromium --with-deps
      - name: Audit all pre-rendered calculator shells
        if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
        env:
          SITE_ROOT: dist
        run: node qa/static-calculator-shell-audit.mjs
      - name: Verify calculator shells with JavaScript disabled
        if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
        env:
          BASE_URL: http://127.0.0.1:4173
        run: node qa/static-calculator-shell-browser-smoke.mjs
      - name: PR browser smoke — canonical calculator embed
        if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
        env:
          BASE_URL: http://127.0.0.1:4173
        run: node qa/embed-browser-smoke.mjs
      - name: PR browser smoke — all registry calculators and scenario features
        if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
        env:
          BASE_URL: http://127.0.0.1:4173
        run: node qa/production-browser-smoke.mjs
      - name: PR browser smoke — all calculators, outputs, bounds and responsive layouts
        if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
        env:
          BASE_URL: http://127.0.0.1:4173
        run: node qa/all-calculators-browser-smoke.mjs
      - name: PR browser smoke — theme and currency preferences
        if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
        env:
          BASE_URL: http://127.0.0.1:4173
        run: node qa/site-preferences-browser-smoke.mjs
      - name: PR browser smoke — cloud workspace save and load
        if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
        env:
          BASE_URL: http://127.0.0.1:4173
        run: node qa/cloud-workspace-sync-browser-smoke.mjs
      - name: PR browser smoke — third-party scripts respect consent and ad slots
        if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
        env:
          BASE_URL: http://127.0.0.1:4173
        run: node qa/third-party-loading-browser-smoke.mjs
      - name: Run seven-page mobile Lighthouse baseline
        env:
          BASE_URL: ${{ (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && 'http://127.0.0.1:4173' || 'https://wealtharrays.com' }}
          LH_OUTPUT_DIR: /tmp/wa-lighthouse
        run: node qa/mobile-lighthouse-baseline.mjs
      - name: Diagnose homepage TBT without Google Funding Choices
        env:
          BASE_URL: ${{ (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && 'http://127.0.0.1:4173' || 'https://wealtharrays.com' }}
          LH_OUTPUT_DIR: /tmp/wa-lighthouse
        run: node qa/homepage-performance-diagnostic.mjs
      - name: Capture SWP typing and scroll CPU profile
        env:
          BASE_URL: ${{ (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && 'http://127.0.0.1:4173' || 'https://wealtharrays.com' }}
        run: node qa/performance-profile.mjs
      - name: Enforce strict mobile release thresholds
        run: node qa/lighthouse-quality-gate.mjs /tmp/wa-lighthouse/summary.json
      - name: Upload Lighthouse and CPU profile reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wealth-arrays-seven-page-mobile-performance
          path: /tmp/wa-lighthouse/
          retention-days: 14

  main-homepage-baseline:
    if: ${{ (github.event_name == 'pull_request' && (startsWith(github.head_ref, 'release/phase0-clean') || startsWith(github.head_ref, 'phase0/pr-c'))) || (github.event_name == 'workflow_dispatch' && (startsWith(github.ref, 'refs/heads/release/phase0-clean') || startsWith(github.ref, 'refs/heads/phase0/pr-c'))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || 'main' }}
          path: main
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.ref }}
          path: pr-tools
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install main dependencies and Lighthouse
        working-directory: main
        run: |
          npm install --no-package-lock
          npm install --no-save --no-package-lock lighthouse@13.0.1 playwright
          npx playwright install chromium --with-deps
      - name: Build main branch baseline
        working-directory: main
        run: npm run build
      - name: Start main preview server
        working-directory: main
        run: |
          nohup node ../pr-tools/qa/performance-preview-server.mjs --root dist --port 4174 >/tmp/wa-main-preview.log 2>&1 &
          echo $! >/tmp/wa-main-preview.pid
          for attempt in {1..30}; do
            if curl -fsSI -H 'Accept-Encoding: br' http://127.0.0.1:4174/ | grep -qi '^content-encoding: br'; then exit 0; fi
            sleep 1
          done
          cat /tmp/wa-main-preview.log
          exit 1
      - name: Run same seven-route Lighthouse settings on main
        working-directory: main
        env:
          BASE_URL: http://127.0.0.1:4174
          LH_OUTPUT_DIR: /tmp/wa-main-lighthouse
        run: node qa/mobile-lighthouse-baseline.mjs
      - name: Run same homepage TBT diagnostic on main
        working-directory: main
        env:
          BASE_URL: http://127.0.0.1:4174
          LH_OUTPUT_DIR: /tmp/wa-main-lighthouse
        run: node ../pr-tools/qa/homepage-performance-diagnostic.mjs
      - name: Upload main-branch baseline artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wealth-arrays-main-homepage-baseline
          path: /tmp/wa-main-lighthouse/
          retention-days: 14
