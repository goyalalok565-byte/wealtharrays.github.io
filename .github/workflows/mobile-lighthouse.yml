name: Mobile Lighthouse Quality Gate

on:
  workflow_run:
    workflows: ["Wealth Arrays Canonical CI"]
    types: [completed]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lighthouse:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') || (github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[canonical-build]')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Wait for production routes
        run: |
          set -euo pipefail
          routes=(/ /tools.html /sip-calculator/ /swp-calculator/ /fire-calculator/ /rent-vs-buy-calculator/ /articles/compound-interest-guide.html)
          for route in "${routes[@]}"; do
            curl -fsSL --max-time 30 "https://wealtharrays.com$route" >/dev/null
          done
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install browser measurement tools
        run: |
          npm install --no-save lighthouse@13.0.1 playwright
          npx playwright install chromium --with-deps
      - name: Run seven-page mobile Lighthouse baseline
        env:
          BASE_URL: https://wealtharrays.com
          LH_OUTPUT_DIR: /tmp/wa-lighthouse
        run: node qa/mobile-lighthouse-baseline.mjs
      - name: Capture SWP typing and scroll CPU profile
        env:
          BASE_URL: https://wealtharrays.com
        run: node qa/performance-profile.mjs
      - name: Upload Lighthouse and CPU profile reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wealtharrays-seven-page-mobile-performance
          path: /tmp/wa-lighthouse/
          retention-days: 14
