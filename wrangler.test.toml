name = "wealtharrays-api-test"
main = "./worker.mjs"
compatibility_date = "2026-10-12"
workers_dev = true

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/v1/*"]
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"

[[ratelimits]]
name = "PUBLIC_API_LIMITER"
namespace_id = "2026112502"
simple = { limit = 120, period = 60 }

[[ratelimits]]
name = "WRITE_API_LIMITER"
namespace_id = "2026112503"
simple = { limit = 20, period = 60 }

[[d1_databases]]
binding = "DB"
database_name = "wealtharrays-saas-test"
database_id = "__TEST_D1_DATABASE_ID__"
migrations_dir = "./migrations"
