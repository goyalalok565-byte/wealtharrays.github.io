<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wealth Arrays Calculator Widget</title>
<style>html,body{margin:0;padding:0;background:transparent;font-family:system-ui,-apple-system,Segoe UI,sans-serif}#calc-widget{min-height:500px}</style>
</head>
<body>
<div id="calc-widget"></div>

<script src="/calculators.js" defer></script>
<script src="/wa-calculator-runtime.js" defer></script>
<script>
(function(){
 function boot(){
  var host=document.getElementById('calc-widget');
  if(!host||host.dataset.waBooted==='1'||host.children.length)return;
  if(typeof mountCalculator!=='function'||typeof CALCULATORS==='undefined')return;
  var id=new URLSearchParams(location.search).get('calc')||'sip';
  var calc=CALCULATORS.find(function(x){return x.id===id||x.slug===id;})||CALCULATORS.find(function(x){return x.id==='sip';})||CALCULATORS[0];
  if(calc){host.dataset.waBooted='1';try{mountCalculator(calc,'calc-widget')}catch(e){host.dataset.waBooted='';console.error(e)}}
 }
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot,{once:true});else boot();
 window.addEventListener('load',boot,{once:true});
})();
</script>
</body>
</html>
