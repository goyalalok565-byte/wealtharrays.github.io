<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wealth Arrays Calculator Widget</title><meta name="description" content="Embeddable Wealth Arrays calculator widget.">
<style>html,body{margin:0;padding:0;background:transparent;font-family:system-ui,-apple-system,Segoe UI,sans-serif}#calc-widget{min-height:500px}</style>
<meta name="robots" content="noindex,follow"><link rel="canonical" href="https://wealtharrays.com/widget.html"><link rel="stylesheet" href="/phase4-premium.css?v=20260915-1"><link rel="stylesheet" href="/cls-fixes.css?v=20260917"><meta name="referrer" content="strict-origin-when-cross-origin"><link rel="stylesheet" href="/styles.css"><link rel="icon" type="image/svg+xml" href="/favicon.svg"><link rel="icon" type="image/png" sizes="48x48" href="/icon-192.png"><link rel="apple-touch-icon" sizes="180x180" href="/icon-512.png"></head>
<body>
<!-- WA-SITE-RUNTIME:v3 -->
<div id="calc-widget"></div>
<script>
(function(){
 function boot(){
  var host=document.getElementById('calc-widget');
  if(!host||host.dataset.waBooted==='1'||host.children.length)return;
  if(typeof mountCalculator!=='function'||typeof CALCULATORS==='undefined')return;
  var id=new URLSearchParams(location.search).get('calc')||'sip';
  var calc=CALCULATORS.find(function(x){return x.id===id||x.slug===id;})||CALCULATORS.find(function(x){return x.id==='sip';})||CALCULATORS[0];
  if(calc){host.dataset.waBooted='1';try{mountCalculator(calc,'calc-widget')}catch(e){host.dataset.waBooted='';console.error(e)}}
 }
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot,{once:true});else boot();
 window.addEventListener('load',boot,{once:true});
})();
</script>
<script src="/wa-site-runtime.js?v=8b464d853d19-20260917-2" defer></script><script src="/calculators.js?v=20260925" defer></script><script src="/wa-calculator-runtime.js?v=6df1fb5a7c6a-20260917-2" defer></script></body>
</html>
